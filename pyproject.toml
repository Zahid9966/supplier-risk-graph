[project]
name = "supplier-risk-graph"
version = "0.1.0"
description = "Multi-tier supplier disruption risk: medallion pipeline, graph contagion features, leakage-checked evaluation, API + dashboard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "pyarrow>=15",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
